# ============================================
# MYSQL DATABASE CONFIGURATION (Production)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/freelance_marketplace?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION (MySQL)
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# ============================================
# LOGGING CONFIGURATION (Production)
# ============================================
logging.level.root=WARN
logging.level.org.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
