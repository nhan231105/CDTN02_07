# Opt-in only: configure database manually after H2 verification.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freelance_marketplace?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:freelance_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
logging.level.org.example=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.sql.init.mode=never