# ============================================
# SPRING APPLICATION CONFIGURATION
# ============================================
spring.application.name=freelance-marketplace
server.port=8082
server.servlet.context-path=/api

# ============================================
# ACTIVE PROFILE (default: h2 for development)
# ============================================
spring.profiles.active=h2

# ============================================
# JPA/HIBERNATE CONFIGURATION (COMMON)
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
jwt.expiration=86400000

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
file.upload.cv-path=/uploads/cv
file.upload.cv-max-size=5242880
file.allowed-cv-mimetypes=application/pdf

# ============================================
# SERVER TIMEZONE & LOCALE
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
