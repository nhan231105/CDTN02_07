# ============================================
# SPRING APPLICATION CONFIGURATION
# ============================================
spring.application.name=freelance-marketplace
server.port=8082
server.servlet.context-path=/api

# ============================================
# ACTIVE PROFILE (default: h2 for development)
# ============================================
spring.profiles.default=mysql

# ============================================
# JPA/HIBERNATE CONFIGURATION (COMMON)
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
file.upload.cv-path=/uploads/cv
file.upload.cv-max-size=5242880
file.allowed-cv-mimetypes=application/pdf
file.upload.directory=${UPLOAD_DIRECTORY:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=12
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ============================================
# SERVER TIMEZONE & LOCALE
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
